<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meter Reader" />
    <title>Meter Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #22c55e 0%, #14532d 100%);
        transition: opacity 0.3s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 8px 24px rgba(0,0,0,0.25));
      }
      #splash-name {
        margin-top: 20px;
        font-family: 'Sora', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: -0.01em;
      }
      #splash-sub {
        margin-top: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: rgba(255,255,255,0.65);
      }
      #splash-dots {
        margin-top: 40px;
        display: flex;
        gap: 6px;
      }
      #splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255,255,255,0.4);
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pulse {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen — shown instantly, dismissed by React after mount -->
    <div id="splash" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#22c55e"/>
            <stop offset="100%" stop-color="#14532d"/>
          </linearGradient>
        </defs>
        <rect width="100" height="100" rx="22" fill="rgba(255,255,255,0.15)"/>
        <path d="M 30 80 A 28 28 0 1 1 70 80" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M 30 80 A 28 28 0 1 1 73 42" fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
        <line x1="24" y1="47" x2="30" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
        <line x1="50" y1="30" x2="50" y2="36" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
        <line x1="76" y1="47" x2="70" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
        <line x1="50" y1="58" x2="68" y2="45" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="50" cy="58" r="5" fill="white"/>
        <circle cx="50" cy="58" r="2.5" fill="rgba(255,255,255,0.5)"/>
      </svg>
      <p id="splash-name">Meter Reader</p>
      <p id="splash-sub">Great Wall Gardens</p>
      <div id="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
